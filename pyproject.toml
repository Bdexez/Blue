[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-neural"
version = "0.1.0"
description = "Trainable multimodal hybrid mixture-of-experts neural network"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=1.26"]

[project.optional-dependencies]
vision = ["Pillow>=10"]

[project.scripts]
blue = "blue.cli:main"

[tool.setuptools.packages.find]
include = ["blue*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# Erreurs réelles (pyflakes) et pièges courants ; le style reste libre.
select = ["F", "B", "RUF059", "PLE"]
ignore = [
    "B023",  # Fermetures appelées dans la même itération (outils et boucle d'entraînement).
    "B028",  # stacklevel des avertissements : pas d'API publique concernée.
    "B905",  # zip(strict=...) : longueurs garanties par construction.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059", "B017"]
"tools/*" = ["F821"]  # Variables de boucle supprimées par del après usage.
